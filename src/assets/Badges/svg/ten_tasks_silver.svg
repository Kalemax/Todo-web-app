    </linearGradient>
  </defs>

  <!-- ribbon tails -->
  <path d="M 78 150 L 60 214 L 84 202 L 96 218 L 104 150 Z" fill="#7c848d"/>
  <path d="M 122 150 L 140 214 L 116 202 L 104 218 L 96 150 Z" fill="#5e656c"/>

